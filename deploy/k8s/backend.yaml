apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-qfield-data
  namespace: app-qfield
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  storageClassName: microk8s-hostpath
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app-qfield
  labels:
    app: backend
    app.kubernetes.io/name: app-qfield
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: app-qfield
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/betabit-technologikal/app-qfield-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: NEBULA_COMMANDER_SERVER_HOST
              value: "0.0.0.0"
            - name: NEBULA_COMMANDER_SERVER_PORT
              value: "8081"
            - name: NEBULA_COMMANDER_DATABASE_URL
              value: "sqlite+aiosqlite:////var/lib/nebula-commander/db.sqlite"
            - name: NEBULA_COMMANDER_CERT_STORE_PATH
              value: "/var/lib/nebula-commander/certs"
            - name: NEBULA_COMMANDER_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: app-qfield-config
                  key: public_url
            - name: NEBULA_COMMANDER_STANDALONE_ADMIN_BOOTSTRAP
              value: "true"
            - name: NEBULA_COMMANDER_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-qfield-secrets
                  key: jwt_secret
            - name: NEBULA_COMMANDER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: app-qfield-secrets
                  key: encryption_key
            - name: NEBULA_COMMANDER_CORS_ORIGINS
              value: "*"
          volumeMounts:
            - name: data
              mountPath: /var/lib/nebula-commander
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: app-qfield-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: app-qfield
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8081
      targetPort: http
